<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Books - Bookstore</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/wishlist.css}"></head><body><div th:replace="~{fragments/customer-sidebar :: sidebar('books')}"></div><main class="main-content"><div class="page"><header class="page-head"><div><p class="eyebrow">Explore the shelves</p><h1>Book <span class="accent">catalog</span></h1><p class="page-sub">Choose a title and save it for later.</p></div></header><section class="panel"><div class="book-grid"><article class="book-card" th:each="book : ${books}"><div class="cover-wrap"><img th:src="${book.coverOrPlaceholder}" th:alt="${book.title}"></div><div class="book-meta"><small th:text="${book.category}">Category</small><h3 th:text="${book.title}">Title</h3><p th:text="${book.author}">Author</p></div><div class="price-row"><span th:text="'LKR ' + ${#numbers.formatDecimal(book.price,1,2)}"></span><span th:text="'★ ' + ${book.rating}"></span></div><div class="actions"><a class="btn-ghost" th:href="@{/books/view/{id}(id=${book.id})}">View</a><a class="btn-primary" th:href="@{/wishlist/add(bookId=${book.id})}">Wishlist</a></div></article></div></section></div></main></body></html>
