<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Management - Bookstore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        a { color: #dc3545; text-decoration: none; }
        .btn { background: #6c757d; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
<h1>User Management System</h1>
<a class="btn" th:href="@{/admin/dashboard}">Back to Dashboard</a>

<h3>All Registered Users (Single Table View)</h3>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>User Type</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">Name</td>
        <td th:text="${u.email}">Email</td>
        <td th:text="${u.class.simpleName}">Type</td>
        <td>
            <a th:href="@{/users/delete/{id}(id=${u.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
