<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${book.title + ' - Bookstore'}">Book</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/wishlist.css}"></head><body><div th:replace="~{fragments/customer-sidebar :: sidebar('books')}"></div><main class="main-content"><div class="page"><header class="page-head"><div><p class="eyebrow" th:text="${book.category}">Book</p><h1 th:text="${book.title}">Title</h1><p class="page-sub" th:text="'by ' + ${book.author}">Author</p></div><a class="btn-ghost" th:href="@{/books}">Back to books</a></header><section class="panel detail-grid"><div class="cover-wrap"><img th:src="${book.coverOrPlaceholder}" th:alt="${book.title}"></div><div><h2 th:text="${book.title}">Title</h2><p class="detail-author" th:text="${book.author}">Author</p><p class="detail-price" th:text="'LKR ' + ${#numbers.formatDecimal(book.price,1,2)}">Price</p><p th:if="${book.rating}" th:text="'★ ' + ${book.rating} + ' reader rating'"></p><a class="btn-primary" th:href="@{/wishlist/add(bookId=${book.id})}">Add to wishlist</a></div></section></div></main></body></html>
