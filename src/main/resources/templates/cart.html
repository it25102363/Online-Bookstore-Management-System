<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Shopping Cart'">Shopping Cart - Bookstore</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dashboard Theme CSS -->
    <style>
        body {
            background-color: #0d1117; /* Deep dark background */
            color: #f0f6fc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            margin: 0;
        }
        /* Sidebar styling */
        .sidebar {
            width: 260px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: fixed;
            height: 100vh;
        }
        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            margin-bottom: 40px;
            display: block;
        }
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-item {
            margin-bottom: 10px;
        }
        .nav-link {
            color: #8b949e;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            display: block;
            transition: all 0.2s ease;
        }
        .nav-link:hover, .nav-link.active {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
        .logout-btn {
            background-color: rgba(255, 107, 107, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .logout-btn:hover {
            background-color: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        /* Main content area */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }
        /* Glassmorphism Card Style */
        .dashboard-card {
            background-color: rgba(22, 27, 34, 0.7);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        .btn-gold {
            background-color: #d4af37;
            color: #0d1117;
            font-weight: 600;
            border: none;
        }
        .btn-gold:hover {
            background-color: #e5c158;
            color: #0d1117;
        }
    </style>
</head>
<body>

<!-- Sidebar Navigation -->
<div class="sidebar">
    <div>
        <a href="#" class="sidebar-brand">📚 Bookstore</a>
        <div class="text-uppercase text-muted small mb-2 px-3" style="font-size: 0.75rem; letter-spacing: 1px;">Browse</div>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" th:href="@{/}">🏠 Home</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/books}">📖 Books</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/wishlist}">🤍 Wishlist</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/cart}">🛒 Cart</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/orders}">📄 Orders</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/profile}">👤 Profile</a></li>
        </ul>
    </div>
    <div>
        <a th:href="@{/logout}" class="logout-btn">Logout</a>
    </div>
</div>

<!-- Main Content Area -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Your Shopping Cart</h2>
        <a th:href="@{/books}" class="btn btn-gold btn-sm px-4">Browse books →</a>
    </div>

    <!-- Cart Card Wrapper -->
    <div class="dashboard-card shadow-sm">
        <div class="alert alert-dark border-secondary text-light mb-4" role="alert" style="background-color: #21262d;">
            Your cart is currently empty. Add some books to get started!
        </div>
        <a th:href="@{/books}" class="btn btn-gold">Explore Catalog</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
