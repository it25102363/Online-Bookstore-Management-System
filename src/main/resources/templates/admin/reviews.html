<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Reviews - Bookstore Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/review.css}">
</head>
<body>

<!-- Admin side menu: change the hrefs to match your existing admin pages -->
<div class="sidebar">
    <div class="sidebar-top">
        <div class="logo-area">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 5c2.5-1.2 5.5-1.2 8 .5v14c-2.5-1.7-5.5-1.7-8-.5V5z"/>
                <path d="M21 5c-2.5-1.2-5.5-1.2-8 .5v14c2.5-1.7 5.5-1.7 8 .5V5z"/>
            </svg>
            Bookstore
        </div>
        <div>
            <p class="sidebar-label">Admin</p>
            <ul class="sidebar-menu">
                <li><a th:href="@{/admin/dashboard}">
                    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Dashboard</a></li>
                <li><a class="active" th:href="@{/admin/reviews}">
                    <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.8L12 3z"/></svg>Reviews</a></li>
            </ul>
        </div>
    </div>
    <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</div>

<div class="main-content">
    <div class="page">
        <p class="eyebrow">Moderation</p>
        <h1>All <span class="accent">Reviews</span></h1>
        <p class="page-sub">
            <span th:text="${#lists.size(reviews)}">0</span> review(s) from customers. You can delete any of them.
        </p>

        <div class="flash" th:if="${success}" th:text="${success}"></div>

        <div class="panel">
            <p class="empty" th:if="${#lists.isEmpty(reviews)}">No reviews have been posted yet.</p>

            <div class="table-responsive" th:unless="${#lists.isEmpty(reviews)}">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Book</th>
                        <th>Rating</th>
                        <th>Review</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reviews}">
                        <td th:text="${r.id}">1</td>
                        <td class="name" th:text="${r.customerName}">Customer</td>
                        <td th:text="${r.bookTitle}">Book</td>
                        <td>
                            <span class="stars">
                                <span th:each="i : ${#numbers.sequence(1, 5)}"
                                      th:class="${i <= r.rating} ? '' : 'off'">&#9733;</span>
                            </span>
                        </td>
                        <td th:text="${r.comment}">Comment</td>
                        <td th:text="${r.createdAt}">Date</td>
                        <td>
                            <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post"
                                  onsubmit="return confirm('Delete this review permanently?');">
                                <button type="submit" class="btn-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
