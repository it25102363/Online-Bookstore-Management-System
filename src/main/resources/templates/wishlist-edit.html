<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Wishlist Item</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/wishlist.css}"></head><body><div th:replace="~{fragments/customer-sidebar :: sidebar('wishlist')}"></div><main class="main-content"><div class="page"><header class="page-head"><div><p class="eyebrow">Update wishlist item</p><h1>Edit <span class="accent" th:text="${item.typeLabel}">item</span></h1><p class="page-sub" th:text="${item.book.title + ' by ' + item.book.author}"></p></div><a class="btn-ghost" th:href="@{/wishlist}">Back</a></header><section class="panel form-panel"><form th:action="@{/wishlist/edit/{id}(id=${item.id})}" method="post"><label class="field" th:if="${item.typeCode == 'PRIORITY'}">Target price<input class="input" name="targetPrice" type="number" min="0" step="0.01" th:value="${item.targetPrice}"></label><label class="field" th:if="${item.typeCode == 'GIFT'}">Gift recipient<input class="input" name="recipientName" maxlength="100" th:value="${item.recipientName}"></label><label class="field">Note<textarea class="textarea" name="note" maxlength="255" th:text="${item.note}"></textarea></label><div class="form-actions"><button class="btn-primary" type="submit">Save changes</button><a class="btn-ghost" th:href="@{/wishlist}">Cancel</a></div></form></section></div></main></body></html>
