<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Bookstore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gold: #e9b44c;
            --ink: #05060a;
            --line: rgba(255,255,255,.10);
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--ink); }
        .font-serif { font-family: 'Instrument Serif', Georgia, serif; }

        /* The old dashboard.css tint/fade overlays were built for the photo hero.
           Switch them off here so the Mood Field shows its true colours. */
        .main-content::before,
        .main-content::after { display: none; }

        /* One glass style, used consistently */
        .glass {
            background: rgba(10, 14, 24, .55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--line);
            box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 24px 48px -24px rgba(0,0,0,.6);
        }

        /* Mood Field sits behind everything in the hero */
        #mood-field { position: absolute; inset: 0; z-index: 0; overflow: hidden; }

        /* Readability layer over the effect */
        .hero-shade {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background:
                linear-gradient(180deg, rgba(5,6,10,.80) 0%, rgba(5,6,10,.30) 38%, rgba(5,6,10,0) 65%),
                linear-gradient(90deg, rgba(5,6,10,.45) 0%, rgba(5,6,10,0) 55%);
        }

        .stat:hover { border-color: rgba(255,255,255,.22); }
        .stat, .action { transition: border-color .2s, background .2s; }
        .action:hover { background: rgba(255,255,255,.08); }

        a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        /* CSS book cover in place of an empty placeholder */
        .cover {
            background: linear-gradient(160deg, #1d3a4f 0%, #0d1b2a 100%);
            box-shadow: -6px 10px 24px rgba(0,0,0,.55), inset 3px 0 0 rgba(255,255,255,.12);
        }
    </style>
</head>
<body class="text-white">

<!-- Side Menu (unchanged) -->
<div class="sidebar">
    <div class="sidebar-top">
        <div class="logo-area">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                <path d="M12 3v18c2.76-2.5 5-3.5 7-3.5V5c-2 0-4.24 1-7 3.5z" opacity="0.7"/>
            </svg>
            Bookstore
        </div>
        <ul class="sidebar-menu">
            <li><a class="active" th:href="@{/customer/dashboard}">Home</a></li>
            <li><a th:href="@{/books}">Books</a></li>
            <li><a th:href="@{/wishlist}">Wishlist</a></li>
            <li><a th:href="@{/cart}">Cart</a></li>
            <li><a th:href="@{/orders}">Orders</a></li>
            <li><a th:href="@{/profile}">Profile</a></li>
        </ul>
    </div>
    <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger" style="width:100%; cursor:pointer;">Logout</button>
        </form>
    </div>
</div>

<div class="main-content" style="padding:0; background:var(--ink); min-height:100vh; position:relative;">
    <section class="relative min-h-screen overflow-hidden flex flex-col">

        <!-- Mood Field effect (replaces the video). Try data-mood="calm" for the blue state. -->
        <div id="mood-field"
             data-mood="intense"
             data-background="#3B0A12"
             data-intense-color="#B0303C"
             data-calm-color="#2f6bff"
             data-swirl="90"
             data-reach="260"></div>
        <div class="hero-shade"></div>

        <div class="relative z-10 w-full max-w-6xl mx-auto px-6 md:px-10 pt-10 flex flex-col flex-1">

            <!-- Greeting -->
            <header class="flex flex-wrap items-end justify-between gap-4">
                <div>
                    <p id="today" class="text-sm text-white/55 mb-1"></p>
                    <h1 class="font-serif text-4xl md:text-5xl leading-tight">
                        <span id="greeting">Welcome back</span>, <span th:text="${user.name}">Customer</span>
                    </h1>
                </div>
                <a th:href="@{/books}" class="bg-white text-black text-sm font-medium px-5 py-2.5 rounded-full hover:bg-white/90 transition-colors">
                    Browse books
                </a>
            </header>

            <!-- Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-8">
                <a th:href="@{/books}" class="stat glass rounded-xl p-5 block">
                    <p class="text-sm text-white/55">Books in library</p>
                    <p class="text-3xl font-semibold mt-2" th:text="${totalBooks != null ? totalBooks : 0}">10</p>
                </a>
                <a th:href="@{/profile}" class="stat glass rounded-xl p-5 block">
                    <p class="text-sm text-white/55">Loyalty points</p>
                    <p class="text-3xl font-semibold mt-2" th:text="${loyaltyPoints != null ? loyaltyPoints : 0}">50</p>
                </a>
                <a th:href="@{/wishlist}" class="stat glass rounded-xl p-5 block">
                    <p class="text-sm text-white/55">Wishlist</p>
                    <p class="text-3xl font-semibold mt-2" th:text="${wishlistCount != null ? wishlistCount : 0}">0</p>
                </a>
                <a th:href="@{/cart}" class="stat glass rounded-xl p-5 block">
                    <p class="text-sm text-white/55">Items in cart</p>
                    <p class="text-3xl font-semibold mt-2" th:text="${cartCount != null ? cartCount : 0}">0</p>
                </a>
            </div>

            <!-- Featured book -->
            <div class="mt-auto pt-16 pb-6 flex flex-col lg:flex-row lg:justify-between lg:items-end gap-4">
                <div class="glass rounded-xl p-5 w-full lg:max-w-md flex gap-5 items-center">
                    <div class="cover relative w-28 h-44 rounded-md overflow-hidden shrink-0 flex items-end p-2">
                        <span class="font-serif italic text-xs leading-tight text-white/80">Harry Potter</span>
                        <img th:src="@{/images/wimpy.jpg}" alt="wimpy"
                             class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">
                    </div>
                    <div class="min-w-0">
                        <span class="inline-block text-[11px] font-medium normal-case tracking-normal text-amber-300 bg-amber-400/15 rounded-full px-2.5 py-0.5 mb-2">Featured this season</span>
                        <h2 class="font-serif text-2xl leading-tight">Wimpy Kid</h2>
                        <p class="text-sm text-white/60 mt-2 leading-relaxed">
                            Diary Of A Wimpy Kid
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    // Greeting + date
    (function () {
        const h = new Date().getHours();
        document.getElementById("greeting").textContent =
            h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
        document.getElementById("today").textContent =
            new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    })();
</script>
<!-- Put mood-field.js in src/main/resources/static/js/ -->
<script th:src="@{/js/mood-field.js}" defer></script>
</body>
</html>
