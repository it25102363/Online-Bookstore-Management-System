<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile - Bookstore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gold: #e9b44c; --ink: #07090f; --line: rgba(255,255,255,.10); }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--ink); }
        .font-serif { font-family: 'Instrument Serif', Georgia, serif; }

        .panel {
            background: rgba(10,14,24,.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 48px -28px rgba(0,0,0,.7);
        }
        .field {
            width: 100%; margin-top: .5rem; padding: .75rem 1rem;
            background: rgba(255,255,255,.04); color: #fff;
            border: 1px solid var(--line); border-radius: .75rem;
            font-size: .95rem; transition: border-color .2s, background .2s, box-shadow .2s;
        }
        .field::placeholder { color: rgba(255,255,255,.3); }
        .field:hover { border-color: rgba(255,255,255,.22); }
        .field:focus {
            outline: none; border-color: var(--gold);
            background: rgba(255,255,255,.06);
            box-shadow: 0 0 0 3px rgba(233,180,76,.18);
        }
        .field:user-invalid { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.15); }
        .save:disabled { opacity: .35; cursor: not-allowed; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    </style>
</head>
<body class="text-white">

<!-- Side Menu -->
<div class="sidebar">
    <div class="sidebar-top">
        <div class="logo-area">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                <path d="M12 3v18c2.76-2.5 5-3.5 7-3.5V5c-2 0-4.24 1-7 3.5z" opacity="0.7"/>
            </svg>
            Bookstore
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/customer/dashboard}">Home</a></li>
            <li><a th:href="@{/books}">Books</a></li>
            <li><a th:href="@{/wishlist}">Wishlist</a></li>
            <li><a th:href="@{/cart}">Cart</a></li>
            <li><a th:href="@{/orders}">Orders</a></li>
            <li><a class="active" th:href="@{/profile}">Profile</a></li>
        </ul>
    </div>
    <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger" style="width:100%; cursor:pointer;">Logout</button>
        </form>
    </div>
</div>

<div class="main-content" style="padding:0; background:var(--ink); min-height:100vh; position:relative; overflow:hidden;">

    <!-- Background photo: put the image at static/images/profile-bg.jpg -->
    <img th:src="@{/images/profile-bg.jpg}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">
    <div class="absolute inset-0 bg-gradient-to-b from-[#07090f]/80 via-[#07090f]/65 to-[#07090f]/90"></div>

    <div class="relative z-10 max-w-5xl mx-auto px-6 md:px-10 py-10">

        <header class="mb-8">
            <h1 class="font-serif text-4xl md:text-5xl">Your profile</h1>
            <p class="text-sm text-white/55 mt-2">Update the name and email linked to your account.</p>
        </header>

        <div class="grid lg:grid-cols-3 gap-6 items-start">

            <!-- Summary card -->
            <aside class="panel rounded-2xl overflow-hidden lg:col-span-1">
                <div class="h-28 relative">
                    <img th:src="@{/images/bg3.jpg}" alt="" class="absolute inset-0 w-full h-full object-cover opacity-80">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0b0e16] to-transparent"></div>
                </div>
                <div class="px-6 pb-6 -mt-10 relative">
                    <div id="avatar"
                         class="w-20 h-20 rounded-full flex items-center justify-center font-serif text-4xl text-amber-300 bg-[#1a1710] border-4 border-[#0b0e16] ring-1 ring-amber-400/40"
                         aria-hidden="true"
                         th:text="${#strings.toUpperCase(#strings.substring(user.name,0,1))}">R</div>
                    <h2 id="previewName" class="text-lg font-semibold mt-4 truncate" th:text="${user.name}">Customer</h2>
                    <p id="previewEmail" class="text-sm text-white/55 truncate" th:text="${user.email}">customer@email.com</p>
                </div>
            </aside>

            <!-- Edit form -->
            <section class="panel rounded-2xl p-6 md:p-8 lg:col-span-2">
                <h2 class="text-lg font-semibold">Account details</h2>
                <p class="text-sm text-white/55 mt-1">Changes apply the next time you sign in with this email.</p>

                <form id="profileForm" th:action="@{/profile/update}" method="post" class="mt-6 space-y-5" novalidate>
                    <div>
                        <label for="name" class="text-sm font-medium text-white/80">Full name</label>
                        <input id="name" class="field" type="text" name="name" th:value="${user.name}"
                               placeholder="Your name" autocomplete="name" required minlength="2" maxlength="60">
                    </div>

                    <div>
                        <label for="email" class="text-sm font-medium text-white/80">Email address</label>
                        <input id="email" class="field" type="email" name="email" th:value="${user.email}"
                               placeholder="you@example.com" autocomplete="email" required>
                        <p class="text-xs text-white/40 mt-2">You use this email to sign in.</p>
                    </div>

                    <p id="formError" class="text-sm text-red-400 hidden" role="alert"></p>

                    <div class="flex items-center justify-end gap-3 pt-5 border-t border-white/10">
                        <a href="#" onclick="history.back(); return false;"
                           class="text-sm font-medium px-5 py-2.5 rounded-full border border-white/20 hover:bg-white/10 transition-colors">Cancel</a>
                        <button id="saveBtn" type="submit" disabled
                                class="save bg-white text-black text-sm font-medium px-6 py-2.5 rounded-full hover:bg-white/90 transition-colors">
                            Save changes
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>

<script>
    (function () {
        const form = document.getElementById("profileForm");
        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const save = document.getElementById("saveBtn");
        const err = document.getElementById("formError");
        const initial = { name: name.value.trim(), email: email.value.trim() };

        function update() {
            const n = name.value.trim(), e = email.value.trim();
            // Live preview on the summary card
            document.getElementById("previewName").textContent = n || initial.name;
            document.getElementById("previewEmail").textContent = e || initial.email;
            if (n) document.getElementById("avatar").textContent = n.charAt(0).toUpperCase();
            // Enable Save only when something changed
            save.disabled = (n === initial.name && e === initial.email);
            err.classList.add("hidden");
        }
        name.addEventListener("input", update);
        email.addEventListener("input", update);

        form.addEventListener("submit", function (ev) {
            if (!form.checkValidity()) {
                ev.preventDefault();
                err.textContent = "Enter a name (2+ characters) and a valid email address.";
                err.classList.remove("hidden");
                return;
            }
            save.disabled = true;
            save.textContent = "Saving...";
        });
    })();
</script>
</body>
</html>
