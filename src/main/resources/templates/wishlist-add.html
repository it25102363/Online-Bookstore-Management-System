<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add to Wishlist</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/wishlist.css}"></head><body>
<div th:replace="~{fragments/customer-sidebar :: sidebar('wishlist')}"></div><main class="main-content"><div class="page"><header class="page-head"><div><p class="eyebrow">New wishlist item</p><h1>Add a <span class="accent">book</span></h1></div><a class="btn-ghost" th:href="@{/wishlist}">Back</a></header><div class="flash-error" th:if="${error}" th:text="${error}"></div>
<section class="panel form-panel"><div class="empty" th:if="${#lists.isEmpty(books)}"><h2>Nothing left to add</h2><p>Every catalog book is already saved.</p></div><form th:unless="${#lists.isEmpty(books)}" th:action="@{/wishlist/add}" method="post">
<label class="field">Book<select class="select" name="bookId" required><option value="" disabled th:selected="${form.bookId == null}">Choose a book</option><option th:each="book : ${books}" th:value="${book.id}" th:selected="${form.bookId == book.id}" th:text="${book.title + ' — ' + book.author}"></option></select></label>
<fieldset class="field"><legend>Type</legend><div class="type-grid"><label><input type="radio" name="type" value="STANDARD" th:checked="${form.type == 'STANDARD'}"> Saved</label><label><input type="radio" name="type" value="PRIORITY" th:checked="${form.type == 'PRIORITY'}"> Must read</label><label><input type="radio" name="type" value="GIFT" th:checked="${form.type == 'GIFT'}"> Gift idea</label></div></fieldset>
<label id="target-field" class="field">Target price<input class="input" name="targetPrice" type="number" min="0" step="0.01" th:value="${form.targetPrice}"></label><label id="recipient-field" class="field">Gift recipient<input class="input" name="recipientName" maxlength="100" th:value="${form.recipientName}"></label><label class="field">Note<textarea class="textarea" name="note" maxlength="255" th:text="${form.note}"></textarea></label><div class="form-actions"><button class="btn-primary" type="submit">Add to wishlist</button><a class="btn-ghost" th:href="@{/wishlist}">Cancel</a></div>
</form></section></div></main><script>function fields(){const v=document.querySelector('input[name=type]:checked').value;document.getElementById('target-field').hidden=v!=='PRIORITY';document.getElementById('recipient-field').hidden=v!=='GIFT'}document.querySelectorAll('input[name=type]').forEach(x=>x.addEventListener('change',fields));fields();</script></body></html>
