<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - BookStore System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
        }
        /* Sidebar Styling */
        .sidebar {
            width: 250px;
            background-color: #212529;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #adb5bd;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar a {
            color: #cfd4da;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #343a40;
            color: #fff;
        }
        /* Main Content Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        /* Top Navigation Bar */
        .header {
            background-color: #343a40;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.5rem;
        }
        .header-actions a {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            color: white;
            margin-left: 10px;
            font-size: 0.9rem;
        }
        .btn-profile { background-color: #0d6efd; }
        .btn-logout { background-color: #dc3545; }
        .btn-profile:hover { background-color: #0b5ed7; }
        .btn-logout:hover { background-color: #bb2d3b; }

        /* Dashboard Content */
        .content {
            padding: 30px;
        }
        .welcome-msg {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #333;
        }
        /* Table Styling */
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h3 {
            margin-bottom: 15px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-danger:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>

<!-- Sidebar Menu -->
<div class="sidebar">
    <h2>BookStore Admin</h2>
    <a href="/admin/dashboard" class="active">Dashboard</a>
    <a href="/profile">My Profile</a>
    <a href="/logout">Logout</a>
</div>

<!-- Main Container -->
<div class="main-container">

    <!-- Header Bar matching customer style -->
    <div class="header">
        <h1>Admin Dashboard</h1>
        <div class="header-actions">
            <a href="/profile" class="btn-profile">Update Profile</a>
            <a href="/logout" class="btn-logout">Logout</a>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content">
        <div class="welcome-msg">
            Welcome, <span th:text="${user.name}">System Admin</span>!
        </div>

        <!-- User Management Table displayed upfront -->
        <div class="card">
            <h3>User Management (CRUD Overview)</h3>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role / Type</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.name}">John Doe</td>
                    <td th:text="${u.email}">john@example.com</td>
                    <td th:text="${u.role != null ? u.role : 'CUSTOMER'}">CUSTOMER</td>
                    <td>
                        <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn-danger" onclick="return confirm('Are you sure you want to delete this user?');">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users == null or users.empty}">
                    <td colspan="5" style="text-align: center; color: #777;">No users found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
