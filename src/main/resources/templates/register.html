<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Bookstore Management</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<!-- Ambient Background Glow Spheres -->
<div class="ambient-glow glow-1"></div>
<div class="ambient-glow glow-2"></div>

<div class="card">

    <!-- Navigation Sidebar -->
    <ul class="card-nav">
        <li>
            <div class="logo-placeholder" title="Bookstore Hub">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
                    <path d="M11 7h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2zm-4-8h2v2H7zm0 4h2v2H7zm0 4h2v2H7zm8-8h2v2h-2zm0 4h2v2h-2zm0 4h2v2H-2z" opacity="0.4"/>
                    <path d="M12 3v18c2.76-2.5 5-3.5 7-3.5V5c-2 0-4.24 1-7 3.5z" opacity="0.7"/>
                </svg>
            </div>
            <!-- Active indicator pill positioned for Sign Up -->
            <span class="active-bar" style="--active: 50%;"></span>
        </li>
        <li>
            <a th:href="@{/login}" class="signin">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
                <span>Sign In</span>
            </a>
        </li>
        <li>
            <a th:href="@{/register}" class="signup active">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                <span>Sign Up</span>
            </a>
        </li>
    </ul>

    <!-- Hero / Visual Panel -->
    <div class="card-hero">
        <img class="hero-bg-img" th:src="@{/images/bg.jpg}" alt="Library bookshelf" fetchpriority="high" />
        <div class="hero-overlay"></div>
        <div class="hero-glass-box">
            <span class="badge-tag">Library Portal</span>
            <h2>Join Us Today.</h2>
            <h3>Create an account to start exploring and managing your literary collection.</h3>
        </div>
    </div>

    <!-- Form Panel -->
    <div class="card-form">
        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="form-header-area">
                <h2>Create Account</h2>
                <p class="form-top">Already have an account? <a th:href="@{/login}">Sign In here.</a></p>
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <input id="name" type="text" th:field="*{name}" placeholder="John Doe" required autofocus />
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input id="email" type="email" th:field="*{email}" placeholder="name@example.com" required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input id="password" type="password" name="password" placeholder="••••••••" required />
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span>Create Account</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>

        </form>
    </div>

</div>
<script th:src="@{/js/transition.js}"></script>
</body>
</html>
